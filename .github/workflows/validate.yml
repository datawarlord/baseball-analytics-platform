
name: Validate Baseball Analytics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run legacy data quality tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_monthly_aggregates.py \
            --ignore=tests/test_monthly_calculations.py \
            -v

      - name: Prepare synthetic monthly data
        env:
          BASEBALL_CURATED_DIR: ${{ runner.temp }}/baseball-ci/curated
        run: |
          python scripts/prepare_ci_data.py \
            --output "$BASEBALL_CURATED_DIR/pitch_details"

      - name: Build monthly aggregates
        env:
          BASEBALL_CURATED_DIR: ${{ runner.temp }}/baseball-ci/curated
        run: |
          python src/build_monthly_aggregates.py

      - name: Run monthly data quality tests
        env:
          BASEBALL_CURATED_DIR: ${{ runner.temp }}/baseball-ci/curated
        run: |
          python -m pytest \
            tests/test_monthly_aggregates.py \
            tests/test_monthly_calculations.py \
            -v
